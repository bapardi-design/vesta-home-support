<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Nua Kinetic Link product family</title>
  <desc id="desc">Six distinct Nua products connected by choice: NuaHome, NuaTalks, NuaInforms, NuaCares, NuaCreates and NuaInvests.</desc>
  <defs>
    <style>
      .title{font:400 68px Georgia,serif;fill:#092f38;letter-spacing:-2px}
      .lead{font:400 23px Inter,Arial,sans-serif;fill:#52666b}
      .name{font:700 30px Georgia,serif;fill:#092f38}
      .role{font:800 12px Inter,Arial,sans-serif;letter-spacing:2px}
      .detail{font:400 16px Inter,Arial,sans-serif;fill:#52666b}
      .rule{stroke:#d7dedb;stroke-width:1}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#092f38" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1600" height="1040" fill="#fbfaf6"/>
  <circle cx="1460" cy="80" r="235" fill="none" stroke="#118f94" stroke-opacity=".10"/>
  <circle cx="1460" cy="80" r="165" fill="none" stroke="#f2b544" stroke-opacity=".12"/>
  <text x="80" y="104" class="role" fill="#118f94">OPEN · INTERLOCKED · IN MOTION</text>
  <text x="80" y="184" class="title">One Nua. Six clear purposes.</text>
  <text x="82" y="226" class="lead">Connected by choice. Distinct by purpose. Private data never crosses silently.</text>

  <g transform="translate(80 292)" filter="url(#shadow)">
    <rect width="440" height="288" rx="24" fill="#fff"/>
    <rect width="7" height="288" rx="4" fill="#118f94"/>
    <image href="../assets/brand/nuahome-mark.svg" x="34" y="40" width="104" height="104"/>
    <text x="165" y="72" class="role" fill="#118f94">AWARENESS</text>
    <text x="165" y="116" class="name">NuaHome</text>
    <line x1="34" y1="174" x2="406" y2="174" class="rule"/>
    <text x="34" y="210" class="detail">Household intelligence</text>
    <text x="34" y="242" class="detail">Rhythm · rooms · learning · care</text>
  </g>

  <g transform="translate(580 292)" filter="url(#shadow)">
    <rect width="440" height="288" rx="24" fill="#fff"/>
    <rect width="7" height="288" rx="4" fill="#0767b5"/>
    <image href="../assets/brand/nuatalks-mark.svg" x="34" y="40" width="104" height="104"/>
    <text x="165" y="72" class="role" fill="#0767b5">PRIVATE SOCIAL</text>
    <text x="165" y="116" class="name">NuaTalks</text>
    <line x1="34" y1="174" x2="406" y2="174" class="rule"/>
    <text x="34" y="210" class="detail">Trusted conversation</text>
    <text x="34" y="242" class="detail">Chats · calls · Circles · Moments</text>
  </g>

  <g transform="translate(1080 292)" filter="url(#shadow)">
    <rect width="440" height="288" rx="24" fill="#fff"/>
    <rect width="7" height="288" rx="4" fill="#f2a500"/>
    <image href="../assets/brand/nuainforms-mark.svg" x="34" y="40" width="104" height="104"/>
    <text x="165" y="72" class="role" fill="#b47900">UNDERSTANDING</text>
    <text x="165" y="116" class="name">NuaInforms</text>
    <line x1="34" y1="174" x2="406" y2="174" class="rule"/>
    <text x="34" y="210" class="detail">Evidence into clarity</text>
    <text x="34" y="242" class="detail">Sources · context · explanation</text>
  </g>

  <g transform="translate(80 630)" filter="url(#shadow)">
    <rect width="440" height="288" rx="24" fill="#fff"/>
    <rect width="7" height="288" rx="4" fill="#3f9a3b"/>
    <image href="../assets/brand/nuacares-mark.svg" x="34" y="40" width="104" height="104"/>
    <text x="165" y="72" class="role" fill="#318c32">SUPPORT</text>
    <text x="165" y="116" class="name">NuaCares</text>
    <line x1="34" y1="174" x2="406" y2="174" class="rule"/>
    <text x="34" y="210" class="detail">Consent-led wellbeing</text>
    <text x="34" y="242" class="detail">Care · reassurance · human choice</text>
  </g>

  <g transform="translate(580 630)" filter="url(#shadow)">
    <rect width="440" height="288" rx="24" fill="#fff"/>
    <rect width="7" height="288" rx="4" fill="#e80958"/>
    <image href="../assets/brand/nuacreates-mark.svg" x="34" y="40" width="104" height="104"/>
    <text x="165" y="72" class="role" fill="#e80958">CREATION</text>
    <text x="165" y="116" class="name">NuaCreates</text>
    <line x1="34" y1="174" x2="406" y2="174" class="rule"/>
    <text x="34" y="210" class="detail">Ideas into finished work</text>
    <text x="34" y="242" class="detail">Writing · visual · production</text>
  </g>

  <g transform="translate(1080 630)" filter="url(#shadow)">
    <rect width="440" height="288" rx="24" fill="#fff"/>
    <rect width="7" height="288" rx="4" fill="#17457c"/>
    <image href="../assets/brand/nuainvests-mark.svg" x="34" y="40" width="104" height="104"/>
    <text x="165" y="72" class="role" fill="#17457c">GROWTH</text>
    <text x="165" y="116" class="name">NuaInvests</text>
    <line x1="34" y1="174" x2="406" y2="174" class="rule"/>
    <text x="34" y="210" class="detail">Governed financial understanding</text>
    <text x="34" y="242" class="detail">Insight · evidence · boundaries</text>
  </g>

  <text x="80" y="990" class="lead">Shared identity is not shared access.</text>
</svg>
